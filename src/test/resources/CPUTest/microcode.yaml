microcode:

  []:
    - type: FetchNext
      pc: PC
      ir: IR

  0x80:
    - type: FetchNext
      pc: PC
      ir: IR

  # INC A
  [0x80, 0x50]:
    - type: IncReg
      reg: A
    - type: ClearIR
      ir: IR

  # DEC A
  [0x80, 0x51]:
    - type: DecReg
      reg: A
    - type: ClearIR
      ir: IR

  # HALT
  0xFF:
    - type: ClearIR
      ir: IR
    - type: End
