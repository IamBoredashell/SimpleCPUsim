flags:
  - name: BIT0_A
    condition: "A(0)"
    target: FLAGS(0)

  - name: BIT1_A
    condition: "A(1)"
    target: FLAGS(1)

  - name: BIT2_A
    condition: "A(2)"
    target: FLAGS(2)

  - name: EVEN_A
    condition: "A(0)==0"
    target: FLAGS(3)

  - name: PREV_BIT0
    condition: "prev.A(0)"
    target: FLAGS(4)

  - name: B_NOTZERO
    condition: "B(0)||B(1)||B(2)||B(3)||B(4)||B(5)||B(6)||B(7)"
    target: FLAGS(5)

  - name: ALWAYS
    condition: "1"
    target: FLAGS(7)

  - name: NEVER
    condition: "0"
    target: FLAGS(6)

  - name: A_EQ_B
    condition: "A(0)==B(0)&&A(1)==B(1)&&A(2)==B(2)&&A(3)==B(3)"
    target: FLAGS(8)

  - name: NOT_ZERO
    condition: "!A(0)&&!A(1)&&!A(2)&&!A(3)&&!A(4)&&!A(5)&&!A(6)&&!A(7)&&!A(8)&&!A(9)&&!A(10)&&!A(11)&&!A(12)&&!A(13)&&!A(14)&&!A(15)"
    target: FLAGS(9)

  - name: PREV_PREV
    condition: "prev.A(0)!=A(0)"
    target: FLAGS(10)
